# abdmall — Supabase project configuration.
# Unspecified keys fall back to CLI defaults; we only pin what matters for this
# project: the Postgres major version (matches the linked remote) and the seed
# wiring so `supabase db reset` re-applies migrations then loads seed.sql.
# Linked project ref: acmkyuwkfualxwlluwbs

project_id = "abdmall"

[db]
# Keep in lockstep with the remote (Postgres 17) so local dev matches prod.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Checkout functions must accept guest (unauthenticated) calls — guest checkout
# is first-class. Auth is handled inside: a user JWT, when present, attaches the
# order to that user; otherwise it's a guest order. The money path is verified
# server-side regardless.
[functions.checkout-start]
verify_jwt = false

[functions.checkout-confirm]
verify_jwt = false

# Paystack authenticates with an x-paystack-signature HMAC, not a Supabase JWT,
# so this must accept unauthenticated requests. The signature is checked inside
# before anything is read from the payload.
[functions.paystack-webhook]
verify_jwt = false
